name: ML Safety Tests

on:
  push:
    branches: [main]
    paths:
      - 'ml/**'
  pull_request:
    paths:
      - 'ml/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ml/requirements.txt'

      - name: Install dependencies
        # Subset of ml/requirements.txt needed by the test suite — keeps CI
        # fast (no shap/optuna/yfinance/supabase compile time).
        run: pip install pandas numpy scipy scikit-learn lightgbm pytest python-dotenv requests urllib3 tqdm pyarrow supabase -q

      - name: Run ML test suite
        run: python -m pytest ml/tests -v
