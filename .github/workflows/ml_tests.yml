name: ML Safety Tests

on:
  push:
    branches: [main]
    paths:
      - 'ml/**'
  pull_request:
    paths:
      - 'ml/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ml/requirements.txt'

      - name: Install dependencies
        run: pip install pandas numpy pytest -q

      - name: Run ML safety tests
        run: python -m pytest ml/tests/test_feature_safety.py -v
