name: Refresh Radar Cache

on:
  schedule:
    - cron: '30 23 * * *'       # 5:00 AM IST daily        — MF + Stocks full rebuild
    - cron: '15 10 * * 1-5'     # 3:45 PM IST weekdays     — Stocks EOD (final prices)
    - cron: '0 4 * * 1-5'       # 9:30 AM IST weekdays     — Stocks intraday
    - cron: '30 5 * * 1-5'      # 11:00 AM IST weekdays    — Stocks intraday
    - cron: '0 7 * * 1-5'       # 12:30 PM IST weekdays    — Stocks intraday
    - cron: '30 8 * * 1-5'      # 2:00 PM IST weekdays     — Stocks intraday
    - cron: '0 10 * * 1-5'      # 3:30 PM IST weekdays     — Stocks intraday (pre-close)
    - cron: '30 18 * * 0'       # 12:00 AM IST Mondays     — Weekly sentiment refresh
  workflow_dispatch:
    inputs:
      target:
        description: 'What to refresh'
        required: false
        default: 'all'
        type: choice
        options: [all, mf, stocks, intraday, sentiment, stock_backfill, mf_backfill]
      backfill_days:
        description: 'Days to backfill for stock_backfill target (default 730)'
        required: false
        default: '730'
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd backend && npm ci

      # Cache OHLCV + fundamentals parquet files across runs (7-day TTL on GH cache)
      # Without this, every nightly run re-fetches 400 days × 84 stocks from scratch.
      - name: Restore OHLCV + macro cache
        uses: actions/cache@v4
        with:
          path: |
            ml/.cache_stock
            ml/.cache_fundamentals
            ml/.cache_macro
            ml/.cache_nav
          key: ml-data-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ml-data-cache-${{ runner.os }}-

      - name: Determine target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 10 * * 1-5" ]; then
            echo "target=stocks" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 23 * * *" ]; then
            echo "target=all" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 18 * * 0" ]; then
            echo "target=sentiment" >> $GITHUB_OUTPUT
          else
            echo "target=intraday" >> $GITHUB_OUTPUT
          fi

      - name: Refresh cache
        if: >-
          steps.target.outputs.target != 'sentiment' &&
          steps.target.outputs.target != 'stock_backfill'
        run: |
          if [ "${{ steps.target.outputs.target }}" = "intraday" ]; then
            node backend/refresh-intraday.js
          else
            node backend/refresh-cache.js ${{ steps.target.outputs.target }}
          fi
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── ML pipeline: runs on nightly rebuild, sentiment, or stock_backfill ──
      - name: Set up Python (ML pipeline)
        if: >-
          steps.target.outputs.target == 'all' ||
          steps.target.outputs.target == 'sentiment' ||
          steps.target.outputs.target == 'stock_backfill' ||
          steps.target.outputs.target == 'mf_backfill'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ml/requirements.txt'

      - name: Install ML dependencies
        if: >-
          steps.target.outputs.target == 'all' ||
          steps.target.outputs.target == 'sentiment' ||
          steps.target.outputs.target == 'stock_backfill' ||
          steps.target.outputs.target == 'mf_backfill'
        run: pip install -r ml/requirements.txt -q

      - name: Check DB tables exist
        if: >-
          steps.target.outputs.target == 'all' ||
          steps.target.outputs.target == 'sentiment' ||
          steps.target.outputs.target == 'stock_backfill' ||
          steps.target.outputs.target == 'mf_backfill'
        id: dbcheck
        run: |
          python ml/setup_db.py --check && echo "tables_ok=true" >> $GITHUB_OUTPUT || echo "tables_ok=false" >> $GITHUB_OUTPUT
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Extract MF features (today)
        if: steps.target.outputs.target == 'all' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/extract_features.py
          python ml/macro_features.py --skip-regression
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Label MF targets — 3M and 1M
        if: steps.target.outputs.target == 'all' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/label_targets.py --window 90
          python ml/label_targets.py --window 30
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Train MF models — 3M and 1M horizons
        if: steps.target.outputs.target == 'all' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/train.py --no-shap --horizon 3m || echo "MF 3M training skipped (insufficient labeled data)"
          python ml/train.py --no-shap --horizon 1m || echo "MF 1M training skipped (insufficient labeled data)"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── Stock ML pipeline: nightly ───────────────────────────────────────────
      - name: Extract stock features (today)
        if: steps.target.outputs.target == 'all' && steps.dbcheck.outputs.tables_ok == 'true'
        run: python ml/extract_stock_features.py   # live fundamentals for today's row
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Label stock targets — 3M and 1M
        if: steps.target.outputs.target == 'all' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/label_stock_targets.py --window 90
          python ml/label_stock_targets.py --window 30
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Train stock models — 3M and 1M horizons
        if: steps.target.outputs.target == 'all' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/train_stock.py --no-shap --horizon 3m || echo "Stock 3M training skipped"
          python ml/train_stock.py --no-shap --horizon 1m || echo "Stock 1M training skipped"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── Stock historical backfill (one-shot) ──────────────────────────────────
      - name: Backfill stock OHLCV + features (${{ github.event.inputs.backfill_days || '730' }} days)
        if: steps.target.outputs.target == 'stock_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: >
          python ml/extract_stock_features.py
          --backfill ${{ github.event.inputs.backfill_days || '730' }}
          --workers 1
          --no-fundamentals
        timeout-minutes: 90
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Label stock targets after backfill — 3M and 1M
        if: steps.target.outputs.target == 'stock_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/label_stock_targets.py --window 90
          python ml/label_stock_targets.py --window 30
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Train stock models after backfill — 3M and 1M
        if: steps.target.outputs.target == 'stock_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/train_stock.py --no-shap --horizon 3m || echo "Stock 3M skipped (insufficient data)"
          python ml/train_stock.py --no-shap --horizon 1m || echo "Stock 1M skipped (insufficient data)"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── MF historical backfill (one-shot, no Yahoo dependency) ───────────────
      - name: Backfill MF features (${{ github.event.inputs.backfill_days || '730' }} days)
        if: steps.target.outputs.target == 'mf_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/extract_features.py --backfill ${{ github.event.inputs.backfill_days || '730' }}
          python ml/macro_features.py --skip-regression
        timeout-minutes: 60
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Label MF targets after backfill — 3M and 1M
        if: steps.target.outputs.target == 'mf_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/label_targets.py --window 90
          python ml/label_targets.py --window 30
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Train MF models after backfill — 3M and 1M
        if: steps.target.outputs.target == 'mf_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/train.py --no-shap --horizon 3m || echo "MF 3M training skipped (insufficient labeled data)"
          python ml/train.py --no-shap --horizon 1m || echo "MF 1M training skipped (insufficient labeled data)"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── Sentiment: runs on Monday midnight IST (weekly) ───────────────────
      - name: Run news sentiment analysis (weekly)
        if: >-
          steps.target.outputs.target == 'sentiment' &&
          steps.dbcheck.outputs.tables_ok == 'true'
        run: python ml/sentiment.py
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
