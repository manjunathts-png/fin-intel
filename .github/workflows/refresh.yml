name: Refresh Radar Cache

on:
  schedule:
    - cron: '30 23 * * *'       # 5:00 AM IST daily        — MF + Stocks full rebuild
    - cron: '15 10 * * 1-5'     # 3:45 PM IST weekdays     — Stocks EOD (final prices)
    - cron: '0 4 * * 1-5'       # 9:30 AM IST weekdays     — Stocks intraday
    - cron: '30 5 * * 1-5'      # 11:00 AM IST weekdays    — Stocks intraday
    - cron: '0 7 * * 1-5'       # 12:30 PM IST weekdays    — Stocks intraday
    - cron: '30 8 * * 1-5'      # 2:00 PM IST weekdays     — Stocks intraday
    - cron: '0 10 * * 1-5'      # 3:30 PM IST weekdays     — Stocks intraday (pre-close)
  workflow_dispatch:
    inputs:
      target:
        description: 'What to refresh'
        required: false
        default: 'all'
        type: choice
        options: [all, mf, stocks, intraday]

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Determine target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 10 * * 1-5" ]; then
            echo "target=stocks" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 23 * * *" ]; then
            echo "target=all" >> $GITHUB_OUTPUT
          else
            echo "target=intraday" >> $GITHUB_OUTPUT
          fi

      - name: Refresh cache
        run: |
          if [ "${{ steps.target.outputs.target }}" = "intraday" ]; then
            node backend/refresh-intraday.js
          else
            node backend/refresh-cache.js ${{ steps.target.outputs.target }}
          fi
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
