name: Refresh Radar Cache

on:
  schedule:
    - cron: '30 23 * * 1-5'     # 5:00 AM IST weeknights    — MF + Stocks + ML full rebuild
    - cron: '15 10 * * 1-5'     # 3:45 PM IST weekdays     — Stocks EOD (final prices)
    - cron: '10 4 * * 1-5'      # 9:40 AM IST weekdays     — Stocks intraday (open)
    - cron: '0 7 * * 1-5'       # 12:30 PM IST weekdays    — Stocks intraday (midday)
    - cron: '0 10 * * 1-5'      # 3:30 PM IST weekdays     — Stocks intraday (pre-close)
    # - cron: '30 18 * * 0'     # 12:00 AM IST Mondays — Weekly GDELT sentiment (disabled: needs ANTHROPIC_API_KEY secret)
  workflow_dispatch:
    inputs:
      target:
        description: 'What to refresh'
        required: false
        default: 'all'
        type: choice
        options: [all, mf, stocks, intraday, sentiment, gdelt_sentiment, stock_backfill, nifty500_backfill, mf_backfill, mf_train, migrate, restore_persistence]
      backfill_days:
        description: 'Days to backfill for stock_backfill/nifty500_backfill (default 365)'
        required: false
        default: '365'
        type: string
      gdelt_weeks:
        description: 'Weeks to backfill for gdelt_sentiment (default 52 = 1 year)'
        required: false
        default: '52'
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd backend && npm ci

      # Cache OHLCV + fundamentals parquet files across runs (7-day TTL on GH cache)
      # Without this, every nightly run re-fetches 400 days × 84 stocks from scratch.
      - name: Restore OHLCV + macro cache
        uses: actions/cache@v4
        with:
          path: |
            ml/.cache_stock
            ml/.cache_fundamentals
            ml/.cache_macro
            ml/.cache_nav
            ml/.cache_bhavcopy
          key: ml-data-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ml-data-cache-${{ runner.os }}-

      - name: Determine target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 10 * * 1-5" ]; then
            echo "target=stocks" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 23 * * 1-5" ]; then
            echo "target=all" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 18 * * 0" ]; then
            echo "target=gdelt_sentiment" >> $GITHUB_OUTPUT
          else
            echo "target=intraday" >> $GITHUB_OUTPUT
          fi

      - name: Restore persistence counters (one-time recovery)
        if: steps.target.outputs.target == 'restore_persistence'
        run: node backend/restore-persistence.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Refresh cache
        if: >-
          steps.target.outputs.target != 'sentiment' &&
          steps.target.outputs.target != 'gdelt_sentiment' &&
          steps.target.outputs.target != 'stock_backfill' &&
          steps.target.outputs.target != 'nifty500_backfill' &&
          steps.target.outputs.target != 'restore_persistence'
        run: |
          if [ "${{ steps.target.outputs.target }}" = "intraday" ]; then
            node backend/refresh-intraday.js
          else
            node backend/refresh-cache.js ${{ steps.target.outputs.target }}
          fi
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Data health check
        # Always run after refresh — reports source connectivity and data freshness.
        # Uses --fix to auto-retry with alternative sources if data is stale.
        # Uses --notify to send email/Telegram alerts on failures (configure secrets below).
        # 'continue-on-error: true' so a failed health check never blocks the ML pipeline.
        if: >-
          steps.target.outputs.target != 'sentiment' &&
          steps.target.outputs.target != 'gdelt_sentiment' &&
          steps.target.outputs.target != 'stock_backfill' &&
          steps.target.outputs.target != 'nifty500_backfill' &&
          steps.target.outputs.target != 'restore_persistence'
        continue-on-error: true
        run: |
          MODE="intraday"
          if [ "${{ steps.target.outputs.target }}" != "intraday" ]; then
            MODE="eod"
          fi
          node backend/data-health-check.js --mode $MODE --fix --notify
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Alert destinations — add these secrets in GitHub → Settings → Secrets → Actions
          # Email (Resend): sign up at resend.com, create API key, set a verified From domain
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL:          ${{ secrets.ALERT_EMAIL }}
          # Telegram: create a bot via @BotFather, send it a message, then call
          #   https://api.telegram.org/bot<TOKEN>/getUpdates to find your chat_id
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── ML pipeline: runs on nightly rebuild, sentiment, backfills ──────────
      - name: Set up Python (ML pipeline)
        if: >-
          steps.target.outputs.target == 'all' ||
          steps.target.outputs.target == 'stocks' ||
          steps.target.outputs.target == 'sentiment' ||
          steps.target.outputs.target == 'gdelt_sentiment' ||
          steps.target.outputs.target == 'stock_backfill' ||
          steps.target.outputs.target == 'nifty500_backfill' ||
          steps.target.outputs.target == 'mf_backfill' ||
          steps.target.outputs.target == 'mf_train'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ml/requirements.txt'

      - name: Install ML dependencies
        if: >-
          steps.target.outputs.target == 'all' ||
          steps.target.outputs.target == 'stocks' ||
          steps.target.outputs.target == 'sentiment' ||
          steps.target.outputs.target == 'gdelt_sentiment' ||
          steps.target.outputs.target == 'stock_backfill' ||
          steps.target.outputs.target == 'nifty500_backfill' ||
          steps.target.outputs.target == 'mf_backfill' ||
          steps.target.outputs.target == 'mf_train'
        run: pip install -r ml/requirements.txt -q

      - name: Check DB tables exist
        if: >-
          steps.target.outputs.target == 'all' ||
          steps.target.outputs.target == 'stocks' ||
          steps.target.outputs.target == 'sentiment' ||
          steps.target.outputs.target == 'gdelt_sentiment' ||
          steps.target.outputs.target == 'stock_backfill' ||
          steps.target.outputs.target == 'nifty500_backfill' ||
          steps.target.outputs.target == 'mf_backfill' ||
          steps.target.outputs.target == 'mf_train'
        id: dbcheck
        run: |
          python ml/setup_db.py --check && echo "tables_ok=true" >> $GITHUB_OUTPUT || echo "tables_ok=false" >> $GITHUB_OUTPUT
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Extract MF features (today)
        if: steps.target.outputs.target == 'all' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/extract_features.py
          python ml/macro_features.py --skip-regression
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KITE_API_KEY:         ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN:    ${{ secrets.KITE_ACCESS_TOKEN }}

      - name: Label MF targets — 3M and 1M + Sharpe backfill
        if: steps.target.outputs.target == 'all' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/label_targets.py --window 90
          python ml/label_targets.py --window 30
          # Backfill Sharpe labels for rows that have fwd_top_q_3m but missing
          # fwd_top_sharpe_q_3m (idempotent — exits fast once all rows are filled)
          python ml/label_targets.py --window 90 --fix-sharpe || echo "Sharpe backfill skipped"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Train MF models — 3M Sharpe-target (primary) + 1M raw-return
        # Retrain daily — train.py both retrains the model AND writes fresh predictions.
        # Without this step predictions go stale. Fixes 1+2 (smart cache + workers=4)
        # already cut nightly to ~31 min, well within the 2,000 min/month free tier.
        if: steps.target.outputs.target == 'all' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/train.py --no-shap --horizon 3m --sharpe-target || echo "MF 3M Sharpe training skipped"
          python ml/train.py --no-shap --horizon 3m || echo "MF 3M raw-return training skipped"
          python ml/train.py --no-shap --horizon 1m || echo "MF 1M training skipped"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── Stock ML pipeline: nightly (all) + EOD (stocks) ────────────────────────
      # Running on 'stocks' (10:15 UTC / 3:45 PM IST) ensures today's EOD prices are
      # available for feature extraction and inference, fixing the "no feature rows near
      # today" failure that occurs when 'all' runs at 5 AM IST before market open.
      - name: Build Nifty 500 universe (daily refresh of constituent list)
        if: >-
          (steps.target.outputs.target == 'all' || steps.target.outputs.target == 'stocks') &&
          steps.dbcheck.outputs.tables_ok == 'true'
        run: python ml/nifty500_universe.py || echo "Nifty 500 universe refresh failed (NSE may be down) — using cached file"

      - name: Extract stock features (today) — Nifty 500 universe
        if: >-
          (steps.target.outputs.target == 'all' || steps.target.outputs.target == 'stocks') &&
          steps.dbcheck.outputs.tables_ok == 'true'
        # Non-blocking: stock extraction failure must not abort MF pipeline.
        # --workers 4: parallel fetch across 4 threads (safe: each stock is independent).
        # Smart cache: stocks whose parquet already has yesterday's close are skipped instantly.
        # Bhavcopy fallback is incremental (only missing trailing days) so Stooq outages
        # no longer cause timeouts — typical time stays ~2 min even when Stooq is fully blocked.
        continue-on-error: true
        run: python ml/extract_stock_features.py --nifty500 --workers 4
        timeout-minutes: 45
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Label stock targets — 3M and 1M
        if: >-
          (steps.target.outputs.target == 'all' || steps.target.outputs.target == 'stocks') &&
          steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/label_stock_targets.py --window 90
          python ml/label_stock_targets.py --window 30
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Train stock models — 3M and 1M horizons
        if: >-
          (steps.target.outputs.target == 'all' || steps.target.outputs.target == 'stocks') &&
          steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/train_stock.py --horizon 3m || echo "Stock 3M training skipped"
          python ml/train_stock.py --horizon 3m --sharpe-target || echo "Stock 3M sharpe skipped"
          python ml/train_stock.py --horizon 1m || echo "Stock 1M training skipped"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── Stock historical backfill (one-shot) ──────────────────────────────────
      # Split into two halves to stay within GitHub's per-step limits.
      # First half: recent 365 days (faster — more cache hits).
      - name: Backfill stock OHLCV + features — recent 365 days
        if: steps.target.outputs.target == 'stock_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: >
          python ml/extract_stock_features.py
          --backfill 365
          --workers 1
          --no-fundamentals
        timeout-minutes: 180
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Second half: older 365–730 days.
      - name: Backfill stock OHLCV + features — older 365-730 days
        if: steps.target.outputs.target == 'stock_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: >
          python ml/extract_stock_features.py
          --backfill ${{ github.event.inputs.backfill_days || '730' }}
          --workers 1
          --no-fundamentals
        timeout-minutes: 180
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Label stock targets after backfill — 3M and 1M
        if: steps.target.outputs.target == 'stock_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/label_stock_targets.py --window 90
          python ml/label_stock_targets.py --window 30
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Train stock models after backfill — 3M and 1M
        if: steps.target.outputs.target == 'stock_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/train_stock.py --horizon 3m || echo "Stock 3M skipped (insufficient data)"
          python ml/train_stock.py --horizon 3m --sharpe-target || echo "Stock 3M sharpe skipped"
          python ml/train_stock.py --horizon 1m || echo "Stock 1M skipped (insufficient data)"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── MF historical backfill (one-shot, no Yahoo dependency) ───────────────
      - name: Backfill MF features (${{ github.event.inputs.backfill_days || '730' }} days)
        if: steps.target.outputs.target == 'mf_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/extract_features.py --backfill ${{ github.event.inputs.backfill_days || '730' }}
          python ml/macro_features.py --skip-regression
        timeout-minutes: 110
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Label MF targets after backfill — 3M and 1M
        if: steps.target.outputs.target == 'mf_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/label_targets.py --window 90
          python ml/label_targets.py --window 30
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Train MF models after backfill — Sharpe + raw-return + 1M
        if: steps.target.outputs.target == 'mf_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/train.py --no-shap --horizon 3m --sharpe-target || echo "MF 3M Sharpe skipped"
          python ml/train.py --no-shap --horizon 3m || echo "MF 3M raw-return skipped"
          python ml/train.py --no-shap --horizon 1m || echo "MF 1M skipped"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── MF complete pipeline (no stock work) — fully server-side ─────────────
      # Seeds .cache_nav on the runner so label_targets.py can compute forward
      # returns and Sharpe ratios without any local machine dependency.
      - name: Set up Python (mf_train)
        if: steps.target.outputs.target == 'mf_train' && steps.dbcheck.outputs.tables_ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ml/requirements.txt'

      - name: Install ML deps (mf_train)
        if: steps.target.outputs.target == 'mf_train' && steps.dbcheck.outputs.tables_ok == 'true'
        run: pip install -r ml/requirements.txt -q

      - name: Extract MF features today + macro (mf_train)
        # Seeds .cache_nav/<code>.parquet for all 75 funds so label_targets.py
        # can compute forward returns and Sharpe ratios server-side.
        # Uses 4 workers — fast enough (~3 min) and won't hit mfapi.in rate limits.
        if: steps.target.outputs.target == 'mf_train' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/extract_features.py --workers 4
          python ml/macro_features.py --skip-regression
        timeout-minutes: 15
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Label MF targets (mf_train) — return + Sharpe quartiles
        if: steps.target.outputs.target == 'mf_train' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/label_targets.py --window 90
          python ml/label_targets.py --window 30
          python ml/label_targets.py --window 90 --fix-sharpe || echo "Sharpe backfill: all rows already labelled"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Train MF models (mf_train) — Sharpe-target + raw-return + 1M
        if: steps.target.outputs.target == 'mf_train' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          # Primary: Sharpe-quartile target (risk-adjusted — reduces high-beta bias)
          python ml/train.py --no-shap --horizon 3m --sharpe-target \
            || echo "MF 3M Sharpe skipped (insufficient Sharpe labels)"

          # Baseline: raw-return 3M (compare AUC vs Sharpe model)
          python ml/train.py --no-shap --horizon 3m \
            || echo "MF 3M raw-return skipped"

          # Short-horizon: 1M raw-return
          python ml/train.py --no-shap --horizon 1m \
            || echo "MF 1M skipped"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── GDELT sentiment: runs Monday midnight IST (replaces legacy sentiment) ─
      - name: GDELT sentiment — MF funds (this week)
        if: >-
          (steps.target.outputs.target == 'gdelt_sentiment' ||
           steps.target.outputs.target == 'sentiment') &&
          steps.dbcheck.outputs.tables_ok == 'true'
        run: python ml/gdelt_sentiment.py --mode mf --backfill 1
        timeout-minutes: 90
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}

      - name: GDELT sentiment — Nifty 500 stocks (this week)
        if: >-
          (steps.target.outputs.target == 'gdelt_sentiment' ||
           steps.target.outputs.target == 'sentiment') &&
          steps.dbcheck.outputs.tables_ok == 'true'
        run: python ml/gdelt_sentiment.py --mode stocks --backfill 1
        timeout-minutes: 180
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}

      # ── Nifty 500 historical backfill (one-shot, trigger manually) ─────────
      - name: Build Nifty 500 universe file
        if: steps.target.outputs.target == 'nifty500_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: python ml/nifty500_universe.py

      - name: Backfill Nifty 500 OHLCV + features (${{ github.event.inputs.backfill_days || '365' }} days)
        if: steps.target.outputs.target == 'nifty500_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: >
          python ml/extract_stock_features.py
          --nifty500
          --backfill ${{ github.event.inputs.backfill_days || '365' }}
          --workers 1
          --no-fundamentals
        timeout-minutes: 350
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Label stock targets after Nifty 500 backfill — 3M and 1M
        if: steps.target.outputs.target == 'nifty500_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/label_stock_targets.py --window 90
          python ml/label_stock_targets.py --window 30
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Train stock models after Nifty 500 backfill — 3M Sharpe + 1M
        if: steps.target.outputs.target == 'nifty500_backfill' && steps.dbcheck.outputs.tables_ok == 'true'
        run: |
          python ml/train_stock.py --horizon 3m --sharpe-target || echo "Stock 3M Sharpe skipped"
          python ml/train_stock.py --horizon 3m || echo "Stock 3M skipped"
          python ml/train_stock.py --horizon 1m || echo "Stock 1M skipped"
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # ── DB migrations (DDL) — run once when new columns are needed ────────
      - name: Set up Python (migrate)
        if: steps.target.outputs.target == 'migrate'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ml/requirements.txt'

      - name: Install deps (migrate)
        if: steps.target.outputs.target == 'migrate'
        run: pip install httpx -q

      - name: Apply pending SQL migrations
        if: steps.target.outputs.target == 'migrate'
        run: python ml/run_migrations.py
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN:  ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL:        ${{ secrets.SUPABASE_DB_URL }}
