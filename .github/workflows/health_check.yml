name: Health Check

# Runs:
#   1. After every "Refresh Radar Cache" workflow completes on main
#   2. Daily at 02:00 UTC (7:30 AM IST) as a safety net
#   3. Manually via workflow_dispatch
on:
  workflow_run:
    workflows: ["Refresh Radar Cache"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 2 * * 2-6'   # 7:30 AM IST Tue–Sat (after Mon–Fri nightly ML run)
  workflow_dispatch:

jobs:
  # ── Job 1: ML pipeline quality checks ──────────────────────────────────────
  ml-quality:
    name: ML Quality
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outcome == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx -q

      - name: Run ML quality checks
        id: check
        run: |
          set +e
          python tests/ml_quality_check.py 2>&1 | tee /tmp/ml_report.txt
          EXIT_CODE=${PIPESTATUS[0]}
          exit $EXIT_CODE
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Upload ML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-quality-report
          path: /tmp/ml_report.txt
          retention-days: 14

  # ── Job 2: Frontend smoke tests (Playwright) ────────────────────────────────
  frontend-smoke:
    name: Frontend Smoke
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.playwright.outcome == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'

      - name: Install Playwright + deps
        run: |
          cd tests && npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright smoke tests
        id: playwright
        run: cd tests && npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  # ── Job 3: Backend unit tests (scoring logic) ───────────────────────────────
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.unit.outcome == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Run backend unit tests
        id: unit
        run: cd backend && npm test

  # ── Job 4: Notify on any failure ───────────────────────────────────────────
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [ml-quality, frontend-smoke, backend-unit]
    if: failure()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install httpx
        run: pip install httpx -q

      - name: Download ML report (if available)
        uses: actions/download-artifact@v4
        with:
          name: ml-quality-report
          path: /tmp/artifacts
        continue-on-error: true

      - name: Send failure email
        continue-on-error: true
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL:     ${{ secrets.ALERT_EMAIL }}
          FROM_EMAIL:      onboarding@resend.dev
          ML_PASSED:       ${{ needs.ml-quality.result == 'success' && 'true' || 'false' }}
          FRONTEND_PASSED: ${{ needs.frontend-smoke.result == 'success' && 'true' || 'false' }}
          BACKEND_PASSED:  ${{ needs.backend-unit.result == 'success' && 'true' || 'false' }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYEOF'
          import os, sys

          ml_passed       = os.environ.get("ML_PASSED", "false") == "true"
          frontend_passed = os.environ.get("FRONTEND_PASSED", "false") == "true"
          backend_passed  = os.environ.get("BACKEND_PASSED", "false") == "true"
          run_url         = os.environ.get("RUN_URL", "")

          failed_jobs = []
          if not ml_passed:
              failed_jobs.append("ML Quality")
          if not frontend_passed:
              failed_jobs.append("Frontend Smoke")
          if not backend_passed:
              failed_jobs.append("Backend Unit Tests")

          subject = f"[Fin Intel] Health check failed: {', '.join(failed_jobs)}"

          lines = [
              f"Health check FAILED — {', '.join(failed_jobs)}",
              "",
              f"Full run details: {run_url}",
              "",
          ]

          if not ml_passed:
              try:
                  report = open("/tmp/artifacts/ml_report.txt").read()
              except Exception:
                  report = "(report not available — check GitHub Actions artifacts)"
              lines += ["── ML Quality check output ──", report, ""]

          if not frontend_passed:
              lines += [
                  "── Frontend Smoke tests ──",
                  "Playwright tests failed. Download the 'playwright-report' artifact from the run URL above.",
                  "",
              ]

          if not backend_passed:
              lines += [
                  "── Backend Unit Tests ──",
                  "Scoring-logic unit tests (node --test) failed. See the run URL above.",
                  "",
              ]

          body = "\n".join(lines)
          sys.argv = [sys.argv[0], subject, body]
          exec(open("tests/notify.py").read())
          PYEOF
