name: Health Check

# Runs:
#   1. After every "Refresh Radar Cache" workflow completes on main
#   2. Daily at 02:00 UTC (7:30 AM IST) as a safety net
#   3. Manually via workflow_dispatch
on:
  workflow_run:
    workflows: ["Refresh Radar Cache"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 2 * * 2-6'   # 7:30 AM IST Tue–Sat (after Mon–Fri nightly ML run)
  workflow_dispatch:

jobs:
  # ── Job 1: ML pipeline quality checks ──────────────────────────────────────
  ml-quality:
    name: ML Quality
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outcome == 'success' && 'true' || 'false' }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx -q

      - name: Run ML quality checks
        id: check
        run: |
          set +e
          OUTPUT=$(python tests/ml_quality_check.py 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          # Escape newlines for multi-line GitHub output
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "report<<$EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ── Job 2: Frontend smoke tests (Playwright) ────────────────────────────────
  frontend-smoke:
    name: Frontend Smoke
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.playwright.outcome == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + deps
        run: |
          cd tests && npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright smoke tests
        id: playwright
        run: cd tests && npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  # ── Job 3: Notify on any failure ───────────────────────────────────────────
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [ml-quality, frontend-smoke]
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install httpx
        run: pip install httpx -q

      - name: Build alert and send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
          ML_REPORT:      ${{ needs.ml-quality.outputs.report }}
          ML_PASSED:      ${{ needs.ml-quality.outputs.passed }}
          FRONTEND_PASSED: ${{ needs.frontend-smoke.outputs.passed }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYEOF'
          import os, sys

          ml_passed      = os.environ.get("ML_PASSED", "false") == "true"
          frontend_passed = os.environ.get("FRONTEND_PASSED", "false") == "true"
          run_url        = os.environ.get("RUN_URL", "")
          ml_report      = os.environ.get("ML_REPORT", "(no output captured)")

          failed_jobs = []
          if not ml_passed:
              failed_jobs.append("ML Quality")
          if not frontend_passed:
              failed_jobs.append("Frontend Smoke")

          subject = f"[Fin Intel] Health check failed: {', '.join(failed_jobs)}"

          lines = [
              f"Health check FAILED — {', '.join(failed_jobs)}",
              "",
              f"Run: {run_url}",
              "",
          ]

          if not ml_passed:
              lines += ["── ML Quality check output ──", ml_report or "(output not captured)", ""]

          if not frontend_passed:
              lines += [
                  "── Frontend Smoke tests ──",
                  "Playwright tests failed. See the 'playwright-report' artifact in the run above.",
                  "",
              ]

          body = "\n".join(lines)

          sys.argv = [sys.argv[0], subject, body]
          exec(open("tests/notify.py").read())
          PYEOF
