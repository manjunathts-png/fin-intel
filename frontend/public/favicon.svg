<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- Green inner square (matches 💹 emoji green) -->
  <rect x="3" y="3" width="26" height="26" rx="5" fill="#22c55e"/>
  <!-- Yen symbol (left of centre) -->
  <text x="12" y="23" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">¥</text>
  <!-- Upward trend line (right side) -->
  <line x1="21" y1="22" x2="27" y2="11" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polyline points="24,11 27,11 27,14" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
