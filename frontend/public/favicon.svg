<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- Rising bar chart -->
  <rect x="4"  y="22" width="5" height="6"  rx="1" fill="#22c55e"/>
  <rect x="12" y="16" width="5" height="12" rx="1" fill="#22c55e"/>
  <rect x="20" y="10" width="5" height="18" rx="1" fill="#4ade80"/>
  <!-- Upward trend line -->
  <polyline points="6.5,21 14.5,15 22.5,9" stroke="#86efac" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dot at top of trend -->
  <circle cx="22.5" cy="9" r="1.5" fill="#86efac"/>
</svg>
